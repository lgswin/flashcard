<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IELTS Flashcards</title>
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1c2430;
    --muted: #5c6673;
    --card: #fffdf8;
    --accent: #c45c26;
    --accent-2: #2c6e6a;
    --line: #e4d9c8;
    --shadow: 0 18px 40px rgba(28,36,48,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #fbe7d4 0%, transparent 50%),
      radial-gradient(900px 500px at 100% 0%, #dceeea 0%, transparent 46%),
      var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header { padding: 22px 24px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .02em; font-weight: 700; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .wrap {
    width: min(760px, calc(100% - 28px));
    margin: 0 auto 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  .toolbar, .controls, .speech {
    background: rgba(255,253,248,.86);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  select {
    border-radius: 12px;
    max-width: 240px;
    padding: 8px 10px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.active { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .interval, .voice {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .interval input[type=range] { width: 130px; accent-color: var(--accent); }
  .interval b { color: var(--ink); min-width: 2.4em; display: inline-block; }
  .stage {
    perspective: 1400px;
    min-height: 340px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    height: min(420px, 58vh);
    position: relative;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 28px;
    text-align: center;
  }
  .back { transform: rotateY(180deg); background: #fff8ef; }
  .tag, .side-label {
    position: absolute;
    top: 18px;
    font-size: 11px;
    color: var(--muted);
  }
  .tag { left: 22px; letter-spacing: .08em; text-transform: uppercase; }
  .side-label { right: 22px; }
  .en { font-size: clamp(28px, 4.4vw, 42px); font-weight: 750; line-height: 1.25; }
  .ko { font-size: clamp(24px, 3.8vw, 36px); font-weight: 700; line-height: 1.4; }
  .ex { margin-top: 18px; color: var(--muted); font-size: 15px; max-width: 34em; line-height: 1.5; }
  .progress { height: 6px; background: #e9dfd1; border-radius: 99px; overflow: hidden; }
  .progress > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), #e08a4f);
    width: 0; transition: width .3s ease;
  }
  .count, .hint { text-align: center; color: var(--muted); font-size: 13px; }
  .hint { font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>IELTS Flashcards</h1>
    <p>앞면 영어 · 뒷면 한국어 · 자동 재생 · 읽어 주기</p>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" id="filters">
        <button data-filter="all" class="active">전체</button>
        <button data-filter="구문">구문</button>
        <button data-filter="어휘">어휘</button>
      </div>
      <div class="interval">
        <span>간격</span>
        <input id="seconds" type="range" min="1" max="10" step="0.5" value="3" />
        <b id="secLabel">3.0초</b>
        <span>/ 면</span>
      </div>
    </div>
    <div class="speech">
      <div class="seg">
        <button id="readToggle" class="active">읽기 켜짐</button>
        <button id="replay">다시 듣기</button>
      </div>
      <div class="seg">
        <label class="voice">영어
          <select id="enVoice"></select>
        </label>
        <label class="voice">한국어
          <select id="koVoice"></select>
        </label>
      </div>
    </div>
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="tag" id="tagF"></div>
          <div class="side-label">English</div>
          <div class="en" id="en"></div>
        </div>
        <div class="face back">
          <div class="tag" id="tagB"></div>
          <div class="side-label">한국어</div>
          <div class="ko" id="ko"></div>
          <div class="ex" id="ex"></div>
        </div>
      </div>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div class="count" id="count"></div>
    <div class="controls">
      <div class="seg">
        <button id="prev">이전</button>
        <button id="play" class="primary">재생</button>
        <button id="next">다음</button>
      </div>
      <div class="seg">
        <button id="shuffle">섞기</button>
        <button id="restart">처음부터</button>
        <button id="backup">백업</button>
        <button id="restore">복원</button>
        <input id="restoreFile" type="file" accept="application/json,.json" hidden />
      </div>
    </div>
    <div class="hint" id="hint">카드를 누르면 뒤집힙니다. 앞면은 영어, 뒷면은 한국어로 읽어 줍니다. 음성이 잘리면 간격을 조금 늘리세요.</div>
  </div>

ic transport is limited.", "tag": "어휘"}, {"en": "on a daily basis", "ko": "매일, 일상적으로", "ex": "Reading a little English on a daily basis is more effective than studying once a week.", "tag": "어휘"}, {"en": "lead to", "ko": "~을 초래하다, ~로 이어지다", "ex": "Eating too much sugar can lead to health problems later in life.", "tag": "어휘"}, {"en": "according to research", "ko": "연구에 따르면", "ex": "According to research, people sleep better if they avoid screens before bed.", "tag": "어휘"}, {"en": "be likely to", "ko": "~할 가능성이 있다", "ex": "Students who review notes the same day are more likely to remember them.", "tag": "어휘"}, {"en": "impulse buying", "ko": "충동구매", "ex": "Impulse buying is more common when people are tired or in a hurry.", "tag": "어휘"}, {"en": "point out", "ko": "지적하다, 지적해서 말하다", "ex": "Teachers often point out that sleep is as important as study.", "tag": "어휘"}, {"en": "prejudice", "ko": "편견", "ex": "Prejudice against older workers is still common in some industries.", "tag": "어휘"}, {"en": "a wide range of", "ko": "다양한 범위의", "ex": "This course covers a wide range of topics, from history to science.", "tag": "어휘"}, {"en": "for instance", "ko": "예를 들어", "ex": "Some foods, for instance nuts and fish, are good for the brain.", "tag": "어휘"}, {"en": "tend to", "ko": "~하는 경향이 있다", "ex": "People tend to eat more when they are watching TV.", "tag": "어휘"}, {"en": "in contrast", "ko": "대조적으로", "ex": "In contrast to sugar, protein helps you feel full for longer.", "tag": "어휘"}, {"en": "have a significant impact on", "ko": "~에 큰 영향을 미치다", "ex": "Regular sleep can have a significant impact on memory.", "tag": "어휘"}, {"en": "in addition", "ko": "게다가, 추가로", "ex": "In addition to English, she is studying French.", "tag": "어휘"}, {"en": "on the other hand", "ko": "반면에", "ex": "Some people love winter. On the other hand, many prefer a warmer climate.", "tag": "어휘"}, {"en": "the vast majority of", "ko": "대다수의", "ex": "The vast majority of students use a laptop in class.", "tag": "어휘"}, let playing = false;
let timer = null;
let filter = "all";
let readOn = true;
let speakToken = 0;

const $ = (id) => document.getElementById(id);
const cardEl = $("card");

function currentCard() { return deck[i]; }
function isFlipped() { return cardEl.classList.contains("flipped"); }

function applyFilter() {
  deck = ALL.filter(c => filter === "all" || c.tag === filter);
  i = 0;
  render(false);
  speakCurrent();
}

function render(flipped) {
  if (!deck.length) return;
  const c = deck[i];
  $("en").textContent = c.en;
  $("ko").textContent = c.ko;
  $("ex").textContent = c.ex || "";
  $("tagF").textContent = c.tag;
  $("tagB").textContent = c.tag;
  cardEl.classList.toggle("flipped", !!flipped);
  $("count").textContent = (i + 1) + " / " + deck.length;
  $("bar").style.width = ((i + 1) / deck.length * 100) + "%";
}

function intervalMs() {
  return Number($("seconds").value) * 1000;
}

function stopSpeech() {
  speakToken += 1;
  try { speechSynthesis.cancel(); } catch (e) {}
}

function selectedVoice(selectId) {
  const uri = $(selectId).value;
  return speechSynthesis.getVoices().find(v => v.voiceURI === uri) || null;
}

function speakText(text, lang, selectId, onDone) {
  stopSpeech();
  const token = speakToken;
  let finished = false;
  const done = () => {
    if (token !== speakToken || finished) return;
    finished = true;
    if (onDone) onDone();
  };
  if (!readOn || !text) { done(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const voice = selectedVoice(selectId);
  if (voice) {
    u.voice = voice;
    u.lang = voice.lang || lang;
  }
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
  setTimeout(() => { if (token === speakToken) done(); }, 12000);
}

function speakCurrent(onDone) {
  const c = currentCard();
  if (!c) { if (onDone) onDone(); return; }
  if (isFlipped()) speakText(c.ko, "ko-KR", "koVoice", onDone);
  else speakText(c.en, "en-GB", "enVoice", onDone);
}

function stopPlay() {
  playing = false;
  clearTimeout(timer);
  $("play").textContent = "재생";
}

function tick() {
  if (!playing) return;
  if (!isFlipped()) {
    render(true);
    speakCurrent(() => {
      if (!playing) return;
      timer = setTimeout(tick, intervalMs());
    });
  } else {
    i = (i + 1) % deck.length;
    render(false);
    speakCurrent(() => {
      if (!playing) return;
      timer = setTimeout(tick, intervalMs());
    });
  }
}

function startPlay() {
  playing = true;
  $("play").textContent = "일시정지";
  clearTimeout(timer);
  speakCurrent(() => {
    if (!playing) return;
    timer = setTimeout(tick, intervalMs());
  });
}

function fillSelect(id, voices, saved) {
  const sel = $(id);
  const prev = saved || sel.value;
  sel.innerHTML = "";
  if (!voices.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "기본 음성";
    sel.appendChild(opt);
    return;
  }
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.voiceURI;
    opt.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(opt);
  });
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  const en = voices.filter(v => /^en/i.test(v.lang));
  const ko = voices.filter(v => /^ko/i.test(v.lang));
  fillSelect("enVoice", en.length ? en : voices, localStorage.getItem("ieltsEnVoice"));
  fillSelect("koVoice", ko.length ? ko : voices, localStorage.getItem("ieltsKoVoice"));
  const preferEn = [...$("enVoice").options].find(o => /google.*uk|daniel|serena|en-GB/i.test(o.textContent))
    || [...$("enVoice").options].find(o => /en-US|samantha|google us/i.test(o.textContent));
  if (!localStorage.getItem("ieltsEnVoice") && preferEn) $("enVoice").value = preferEn.value;
  const preferKo = [...$("koVoice").options].find(o => /yuna|google.*ko|korean|유나|지윤/i.test(o.textContent));
  if (!localStorage.getItem("ieltsKoVoice") && preferKo) $("koVoice").value = preferKo.value;
}

$("play").onclick = () => playing ? stopPlay() : startPlay();
$("next").onclick = () => { i = (i + 1) % deck.length; render(false); speakCurrent(); };
$("prev").onclick = () => { i = (i - 1 + deck.length) % deck.length; render(false); speakCurrent(); };
$("restart").onclick = () => { i = 0; render(false); speakCurrent(); };
$("shuffle").onclick = () => {
  for (let n = deck.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    [deck[n], deck[j]] = [deck[j], deck[n]];
  }
  i = 0;
  render(false);
  speakCurrent();
};
cardEl.onclick = () => {
  cardEl.classList.toggle("flipped");
  speakCurrent();
};
$("seconds").oninput = () => {
  $("secLabel").textContent = Number($("seconds").value).toFixed(1) + "초";
};
$("readToggle").onclick = () => {
  readOn = !readOn;
  $("readToggle").classList.toggle("active", readOn);
  $("readToggle").textContent = readOn ? "읽기 켜짐" : "읽기 꺼짐";
  if (!readOn) stopSpeech();
  else speakCurrent();
};
$("replay").onclick = () => speakCurrent();
$("enVoice").onchange = () => {
  localStorage.setItem("ieltsEnVoice", $("enVoice").value);
  if (!isFlipped()) speakCurrent();
};
$("koVoice").onchange = () => {
  localStorage.setItem("ieltsKoVoice", $("koVoice").value);
  if (isFlipped()) speakCurrent();
};
document.querySelectorAll("#filters button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.filter;
    applyFilter();
  };
});

function setHint(msg) { $("hint").textContent = msg; }

function backupPayload() {
  return {
    version: 1,
    savedAt: new Date().toISOString(),
    interval: Number($("seconds").value),
    filter,
    index: i,
    cards: ALL
  };
}

function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

$("backup").onclick = () => {
  const stamp = new Date().toISOString().slice(0, 10);
  downloadJson(backupPayload(), "ielts-flashcards-backup-" + stamp + ".json");
  setHint("JSON 백업 파일을 저장했습니다.");
};

function normalizeCards(raw) {
  if (!Array.isArray(raw) || !raw.length) throw new Error("empty");
  return raw.map((c) => {
    const en = (c.en || c.english || c.front || "").trim();
    const ko = (c.ko || c.korean || c.back || "").trim();
    if (!en || !ko) throw new Error("bad card");
    return { en, ko, ex: (c.ex || c.example || "").trim(), tag: c.tag || "어휘" };
  });
}

function applyBackup(data) {
  let cards, savedFilter = "all", savedIndex = 0, savedInterval;
  if (Array.isArray(data)) cards = normalizeCards(data);
  else if (data && Array.isArray(data.cards)) {
    cards = normalizeCards(data.cards);
    savedFilter = data.filter || "all";
    savedIndex = Number(data.index) || 0;
    savedInterval = data.interval;
  } else throw new Error("format");
  ALL = cards;
  filter = savedFilter;
  document.querySelectorAll("#filters button").forEach((b) => {
    b.classList.toggle("active", b.dataset.filter === filter);
  });
  if (savedInterval) {
    $("seconds").value = savedInterval;
    $("secLabel").textContent = Number(savedInterval).toFixed(1) + "초";
  }
  applyFilter();
  if (deck.length) i = Math.min(Math.max(savedIndex, 0), deck.length - 1);
  render(false);
  speakCurrent();
  setHint(ALL.length + "장을 JSON에서 복원했습니다.");
}

$("restore").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { applyBackup(JSON.parse(reader.result)); }
    catch (err) { setHint("복원에 실패했습니다. JSON 파일 형식을 확인해 주세요."); }
  };
  reader.readAsText(file, "utf-8");
};

document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); playing ? stopPlay() : startPlay(); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "Enter") { cardEl.classList.toggle("flipped"); speakCurrent(); }
  if (e.key === "r") speakCurrent();
});

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
applyFilter();
</script>
</body>
</html>
